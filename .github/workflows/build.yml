name: Build Fladder (Windows)

on:
  push:
    tags:
      - "v*"
      - "*[0-9]*-vh.*"
    branches:
      - develop
  pull_request:
    paths:
      - pubspec.yaml
      - .github/workflows/build.yml
      - .fvmrc
      - "windows/**"
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release publishes a GitHub release, nightly updates nightly pre-release, development only builds artifacts)"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - nightly
          - development
      release_tag:
        description: "Optional tag name for release builds (defaults to <version>-vh.1)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY_TAG: nightly

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.check.outputs.build_type }}
    steps:
      - name: Determine build type
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          elif [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" && "${{ github.ref_name }}" != "${{ env.NIGHTLY_TAG }}" ]]; then
            BUILD_TYPE="release"
          else
            # Branch pushes (e.g. develop) and PRs validate the Windows build without publishing a release
            BUILD_TYPE="development"
          fi

          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"
          echo "Build type determined: ${BUILD_TYPE}"

  fetch-info:
    needs: [check-trigger]
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.fetch.outputs.version_name }}
      flutter_version: ${{ steps.fetch.outputs.flutter_version }}
      release_tag: ${{ steps.fetch.outputs.release_tag }}
      display_version: ${{ steps.fetch.outputs.display_version }}
      build_type: ${{ needs.check-trigger.outputs.build_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch version metadata
        id: fetch
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_TYPE: ${{ needs.check-trigger.outputs.build_type }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | cut -d ':' -f2 | cut -d '+' -f1 | tr -d ' ')
          FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)

          if [[ "$BUILD_TYPE" == "nightly" ]]; then
            RELEASE_TAG="${NIGHTLY_TAG}"
            DISPLAY_VERSION="${VERSION_NAME}-nightly"
          elif [[ "$BUILD_TYPE" == "release" ]]; then
            if [[ -n "$INPUT_RELEASE_TAG" ]]; then
              RELEASE_TAG="$INPUT_RELEASE_TAG"
            elif [[ "$REF_TYPE" == "tag" ]]; then
              RELEASE_TAG="$REF_NAME"
            else
              RELEASE_TAG="${VERSION_NAME}-vh.1"
            fi
            DISPLAY_VERSION="${RELEASE_TAG#v}"
          else
            RELEASE_TAG=""
            DISPLAY_VERSION="${VERSION_NAME}-dev"
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "flutter_version=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "display_version=${DISPLAY_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Base version: $VERSION_NAME"
          echo "Flutter version: $FLUTTER_VERSION"
          echo "Release tag: $RELEASE_TAG"
          echo "Display version: $DISPLAY_VERSION"

  build-windows:
    runs-on: windows-2022
    needs: [fetch-info]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release --build-number=${{ github.run_number }}

      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/windows_setup.iss
          options: /O+ /DFLADDER_VERSION="${{ needs.fetch-info.outputs.display_version }}"

      - name: Archive Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fladder-windows-portable
          path: build\windows\x64\runner\Release\

      - name: Archive Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fladder-windows-installer
          path: windows\Output\fladder_setup.exe

  create_release:
    name: Create & Publish Windows Release
    needs:
      - fetch-info
      - build-windows
    runs-on: ubuntu-latest
    if: needs.fetch-info.outputs.build_type == 'release' || needs.fetch-info.outputs.build_type == 'nightly'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete existing nightly release
        if: needs.fetch-info.outputs.build_type == 'nightly'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing nightly release..."
          if gh release view "${{ env.NIGHTLY_TAG }}" >/dev/null 2>&1; then
            echo "Deleting existing nightly release..."
            gh release delete "${{ env.NIGHTLY_TAG }}" --yes --cleanup-tag
          fi
          if git tag -l | grep -q "^${{ env.NIGHTLY_TAG }}$"; then
            git push origin --delete "${{ env.NIGHTLY_TAG }}" || true
          fi

      - name: Download Windows portable artifact
        uses: actions/download-artifact@v4
        with:
          name: fladder-windows-portable
          path: fladder-windows-portable

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: fladder-windows-installer
          path: fladder-windows-installer

      - name: Package Windows artifacts & checksums
        env:
          DISPLAY_VERSION: ${{ needs.fetch-info.outputs.display_version }}
        run: |
          command -v zip >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y zip)
          (
            cd fladder-windows-portable
            zip -r "../Fladder-Windows-${DISPLAY_VERSION}.zip" .
          )
          mv fladder-windows-installer/fladder_setup.exe "Fladder-Windows-${DISPLAY_VERSION}-Setup.exe"
          sha256sum "Fladder-Windows-${DISPLAY_VERSION}.zip" "Fladder-Windows-${DISPLAY_VERSION}-Setup.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TYPE: ${{ needs.fetch-info.outputs.build_type }}
          VERSION_NAME: ${{ needs.fetch-info.outputs.version_name }}
          DISPLAY_VERSION: ${{ needs.fetch-info.outputs.display_version }}
          RELEASE_TAG: ${{ needs.fetch-info.outputs.release_tag }}
        run: |
          PREVIOUS_RELEASE=$(gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq '.[].tagName' | grep -vx "$RELEASE_TAG" | head -n 1 || true)
          if [[ -z "$PREVIOUS_RELEASE" ]]; then
            PREVIOUS_RELEASE=$(git tag --list --sort=-creatordate | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-vh\.[0-9]+)?$' | grep -vx "$RELEASE_TAG" | head -n 1 || true)
          fi

          if [[ -n "$PREVIOUS_RELEASE" ]] && git rev-parse "${PREVIOUS_RELEASE}^{commit}" >/dev/null 2>&1; then
            RANGE="${PREVIOUS_RELEASE}..HEAD"
          else
            PREVIOUS_RELEASE=""
            RANGE="HEAD"
          fi

          if [[ "$BUILD_TYPE" == "nightly" ]]; then
            cat > changelog.md <<EOF
          # $(date -u "+%Y-%m-%d %H:%M:%S UTC")

          Automated Windows x64 nightly build from the Vicente fork of Fladder.

          **⚠️ Warning:** This is a development build and may contain bugs or incomplete features.

          EOF
          else
            cat > changelog.md <<EOF
          ## Vicente fork release

          This release contains Vicente's Windows & playback enhancements merged with upstream Fladder ${VERSION_NAME}.

          ### Download

          - \`Fladder-Windows-${DISPLAY_VERSION}.zip\` — Portable Windows x64 archive (extract all files and run \`fladder.exe\`).
          - \`Fladder-Windows-${DISPLAY_VERSION}-Setup.exe\` — Windows x64 installer.
          - \`SHA256SUMS.txt\` — SHA-256 checksums for verification (Windows Defender may flag unsigned Flutter binaries as false positives).

          EOF
          fi

          echo "## 📋 What's Changed" >> changelog.md
          echo "" >> changelog.md
          python3 .github/scripts/changelog.py "$RANGE" >> changelog.md

          if [[ -n "$PREVIOUS_RELEASE" ]]; then
            echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREVIOUS_RELEASE}...${RELEASE_TAG}" >> changelog.md
          fi

      - name: Create & Publish Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ needs.fetch-info.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && format('🌙 Nightly Build - {0}', needs.fetch-info.outputs.display_version) || format('Fladder v{0} — Vicente fork', needs.fetch-info.outputs.display_version) }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ needs.fetch-info.outputs.build_type == 'nightly' }}
          make_latest: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          fail_on_unmatched_files: true
          files: |
            Fladder-Windows-${{ needs.fetch-info.outputs.display_version }}-Setup.exe
            Fladder-Windows-${{ needs.fetch-info.outputs.display_version }}.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
